<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>修仙问道 · 融合版</title>
<style>
html,body{margin:0;padding:0;background:#05070a;min-height:100%}
body{display:flex;align-items:flex-start;justify-content:center;padding:18px 10px;box-sizing:border-box}
#qa{--g:#d9b46a;--g2:#f2d79b;--j:#6fd3c7;--r:#d2706a;font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;color:#e9e3d5;width:100%}
#qa *{box-sizing:border-box}
#qa .fr{position:relative;display:flex;flex-direction:column;width:100%;max-width:560px;margin:0 auto;height:700px;max-height:93vh;border:1px solid rgba(217,180,106,.26);border-radius:18px;overflow:hidden;background:radial-gradient(130% 90% at 50% 0%,#1b2434,#0c1118 58%,#070a0e);box-shadow:0 16px 40px rgba(0,0,0,.55)}
#qa .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px 5px}
#qa .rl{font-size:15px;letter-spacing:.1em;color:var(--g2);padding:4px 10px;border:1px solid rgba(217,180,106,.4);border-radius:8px;background:linear-gradient(180deg,rgba(217,180,106,.15),rgba(217,180,106,.02));white-space:nowrap}
#qa .hi{font-size:10.5px;line-height:1.5;color:#98a1af;text-align:right}
#qa .hi b{color:var(--g);font-weight:400;font-variant-numeric:tabular-nums}
#qa .brs{padding:0 12px 3px;display:grid;gap:5px}
#qa .br{display:flex;align-items:center;gap:6px;font-size:10px;color:#8b93a2}
#qa .br>i{width:22px;flex:none;font-style:normal}
#qa .tk{flex:1;height:5px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
#qa .tk s{display:block;height:100%;width:0;text-decoration:none;transition:width .25s}
#qa .q s{background:linear-gradient(90deg,#8a6a2f,#f2d79b)}
#qa .h s{background:linear-gradient(90deg,#6d2b2b,#d2706a)}
#qa .d s{background:linear-gradient(90deg,#2d6a63,#6fd3c7)}
#qa .m s{background:linear-gradient(90deg,#2b4d8f,#6aa8ff)}
#qa .br em{font-style:normal;min-width:66px;text-align:right;color:#cfd6e2;font-variant-numeric:tabular-nums}
#qa .rs{display:flex;flex-wrap:wrap;gap:3px 9px;padding:5px 12px 7px;font-size:10.5px;color:#8b93a2;border-bottom:1px solid rgba(255,255,255,.06)}
#qa .rs b{color:var(--j);font-weight:400;font-variant-numeric:tabular-nums}
#qa .bd{flex:1;overflow-y:auto;padding:9px 11px 11px;scrollbar-width:thin}
#qa .bd::-webkit-scrollbar{width:4px}#qa .bd::-webkit-scrollbar-thumb{background:rgba(217,180,106,.3);border-radius:4px}
#qa .c{border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:9px 10px;margin-bottom:7px;background:rgba(255,255,255,.024)}
#qa .c h4{margin:0 0 5px;font-size:12px;font-weight:400;color:var(--g2);letter-spacing:.07em;display:flex;justify-content:space-between;gap:6px}
#qa .c h4 u{text-decoration:none;font-size:10px;color:var(--j)}
#qa .c p{margin:0 0 4px;font-size:11px;line-height:1.7;color:#93a0b1}
#qa .c p:last-child{margin-bottom:0}
#qa .rw{display:flex;align-items:center;justify-content:space-between;gap:8px}
#qa .rw>div{min-width:0;flex:1}
#qa .b{font-family:inherit;font-size:12px;letter-spacing:.05em;color:#efe6d2;cursor:pointer;padding:8px 11px;border-radius:9px;border:1px solid rgba(217,180,106,.3);background:linear-gradient(180deg,rgba(217,180,106,.14),rgba(217,180,106,.03));transition:transform .1s,background .15s;white-space:nowrap}
#qa .b:active{transform:scale(.97)}
#qa .b.sm{font-size:10.5px;padding:5px 8px;border-radius:7px}
#qa .b.w{width:100%;padding:10px;font-size:13px}
#qa .b.mn{background:linear-gradient(180deg,rgba(111,211,199,.2),rgba(111,211,199,.05));border-color:rgba(111,211,199,.4);color:#dff7f3}
#qa .b.x{opacity:.3;pointer-events:none}
#qa .g2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#qa .lgs{max-height:120px;overflow-y:auto;border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:7px 9px;background:rgba(4,6,10,.5)}
#qa .lgs p{margin:0 0 4px;font-size:11px;line-height:1.65}
#qa .gr{color:#8fd8a8}#qa .bb{color:var(--j)}#qa .oo{color:var(--g2)}#qa .rr{color:#e2847c}#qa .mm{color:#7f8798}
#qa .tb{display:grid;grid-template-columns:repeat(11,1fr);gap:1px;padding:6px 6px 8px;border-top:1px solid rgba(255,255,255,.07);background:rgba(4,6,10,.42)}
#qa .bb2{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin:4px 0 8px}
#qa .bb2 s{display:block;height:100%;text-decoration:none;transition:width .25s}
#qa .op.x{opacity:.3;pointer-events:none}
#qa .op small{color:#98a1af;font-size:10.5px}
#qa .sv{padding:3px 12px 5px;font-size:10px;color:#8fd8a8;border-bottom:1px solid rgba(255,255,255,.06)}
#qa .sv.bad{color:#e2847c}
#qa textarea.qc{width:100%;height:110px;font-size:10px;font-family:monospace;color:#e9e3d5;background:rgba(4,6,10,.6);border:1px solid rgba(217,180,106,.3);border-radius:8px;padding:7px;box-sizing:border-box;word-break:break-all}
#qa .mpc{position:relative;height:290px;border:1px solid rgba(217,180,106,.18);border-radius:10px;background:radial-gradient(120% 100% at 50% 0%,rgba(217,180,106,.07),rgba(4,6,10,.55));overflow:hidden}
#qa .mpc svg{position:absolute;inset:0;width:100%;height:100%}
#qa .nd{position:absolute;transform:translate(-50%,-50%);width:56px;text-align:center;padding:4px 2px;border:1px solid rgba(255,255,255,.18);border-radius:7px;background:rgba(10,14,20,.94);color:#8b93a2}
#qa .nd b{display:block;font-size:10px;font-weight:400;line-height:1.35;color:#cfd6e2}
#qa .nd span{font-size:8.5px;color:#7f8798}
#qa .nd.seen{border-color:rgba(217,180,106,.4)}
#qa .nd.adj{border-color:rgba(111,211,199,.75);cursor:pointer;box-shadow:0 0 8px rgba(111,211,199,.25)}
#qa .nd.cur{border-color:#d9b46a;background:rgba(217,180,106,.18);box-shadow:0 0 10px rgba(217,180,106,.35)}
#qa .nd.cur b{color:#f2d79b}
#qa .tb button{font-family:inherit;font-size:10px;color:#8b93a2;cursor:pointer;padding:7px 0;border-radius:8px;border:1px solid transparent;background:transparent;transition:all .15s;position:relative}
#qa .tb button.on{color:var(--g2);background:rgba(217,180,106,.12);border-color:rgba(217,180,106,.3)}
#qa .tb button i{position:absolute;top:3px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--r);display:none}
#qa .tb button i.s{display:block}
#qa .ov{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:20px 18px;background:linear-gradient(180deg,rgba(6,9,13,.97),rgba(10,14,20,.99));z-index:6;overflow-y:auto}
#qa .ov.on{display:flex}
#qa .ov h5{margin:0 0 8px;font-size:16px;font-weight:400;letter-spacing:.16em;color:var(--g2);text-align:center}
#qa .ov .tx{font-size:12.5px;line-height:1.95;color:#c9d2de;margin-bottom:14px;letter-spacing:.02em}
#qa .ov .op{width:100%;text-align:left;margin-bottom:8px;padding:11px 12px;font-family:inherit;font-size:12px;line-height:1.6;color:#e6dcc7;cursor:pointer;border-radius:10px;border:1px solid rgba(217,180,106,.28);background:linear-gradient(180deg,rgba(217,180,106,.1),rgba(217,180,106,.02));transition:all .15s}
#qa .ov .op:hover{border-color:rgba(217,180,106,.6);background:rgba(217,180,106,.16)}
#qa .ov .cg{margin-top:12px;font-size:10.5px;color:#6f7684;text-align:center;letter-spacing:.05em}
#qa #qpop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,6,9,.74);z-index:50;padding:24px}
#qa #qpop.on{display:flex}
#qa .popCard{background:linear-gradient(180deg,#141b26,#0d1219);border:1px solid #b98a2f;border-radius:14px;padding:20px 18px 14px;width:100%;max-width:330px;text-align:center;box-shadow:0 10px 34px rgba(0,0,0,.55)}
#qa .popT{font-size:17px;color:#e8c97a;letter-spacing:3px;margin-bottom:10px}
#qa .popIt{font-size:15px;color:#f2e7c8;margin:5px 0}
#qa .popMore{font-size:12px;opacity:.65;margin-top:8px}
#qa .popCard .op{margin-top:12px}

:root{--ac:#d9b45b}
.btA{position:relative}
.fl{position:absolute;right:10px;top:2px;font-size:15px;font-weight:700;pointer-events:none;z-index:6;animation:flUp .95s ease-out forwards;text-shadow:0 1px 3px #000}
.fl.e{color:#ffd75e}.fl.p{color:#ff9a8a}.fl.h{color:#8fd8a8}.fl.crit{font-size:21px;color:#ffb347}
@keyframes flUp{0%{opacity:0;transform:translateY(8px) scale(.9)}18%{opacity:1}100%{opacity:0;transform:translateY(-30px) scale(1.05)}}
.hitF{animation:hitF .35s}
@keyframes hitF{0%{background:rgba(255,92,80,.28)}100%{background:transparent}}
#qfx{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,rgba(70,60,120,.55),rgba(5,5,12,.93) 70%);animation:fxIn .3s}
#qfx .beam{width:110px;height:44vh;background:linear-gradient(180deg,rgba(255,215,110,0),rgba(255,215,110,.85),rgba(255,215,110,0));filter:blur(2px);animation:beamA 1.6s ease-out}
#qfx .bt2{font-size:26px;color:#ffd75e;letter-spacing:4px;margin-top:10px;text-shadow:0 0 18px rgba(255,190,60,.8)}
#qfx .bs2{font-size:13px;color:#cfd6e4;margin-top:8px}
#qfx.fail{background:radial-gradient(ellipse at 50% 30%,rgba(90,30,30,.5),rgba(8,4,4,.94) 70%)}
#qfx.fail .bt2{color:#e2847c;text-shadow:0 0 18px rgba(220,60,40,.7)}
#qfx.mini{background:rgba(5,5,12,.45)}
#qfx.mini .bt2{font-size:20px}
@keyframes beamA{0%{transform:scaleY(.2);opacity:0}30%{opacity:1}100%{transform:scaleY(1);opacity:.9}}
@keyframes fxIn{from{opacity:0}to{opacity:1}}
body.bigF #qbd{font-size:16px}
body.bigF #qbd p,body.bigF .tx{font-size:15px;line-height:1.8}
#qtb button.on{border-color:var(--ac)}
.ov h5{color:var(--ac)}
</style>
</head>
<body>
<div id="qa">
<div class="fr">
<div class="hd"><div class="rl" id="qr">炼气初期</div><div class="hi"><div>寿元 <b id="qage">16</b> / <b id="qlife">90</b> · 第 <b id="qgen">1</b> 世</div><div>灵石 <b id="qst">0</b> · 战力 <b id="qpw">0</b></div></div></div>
<div class="brs">
<div class="br q"><i>修为</i><div class="tk"><s id="qq"></s></div><em id="qqt">0/60</em></div>

</div>

</div>

<script>
(function(){
var A=document.getElementById('qa');if(!A||A.getAttribute('data-b'))return;A.setAttribute('data-b','1');
var KEY='qx_merge_v1';
var R=['炼气','筑基','金丹','元婴','化神','炼虚','合体','大乘','渡劫','真仙','金仙','大罗'];
var SB=['初期','中期','后期'];
var RM={'黄':1.0,'玄':1.22,'地':1.5,'天':1.9};
var ROOTS=[
{id:'wuling',n:'五灵根',w:20,elems:['金','木','水','火','土'],grade:'黄',rate:.85,atk:0,def:.05,hp:.05,d:'五行俱全，修炼最慢，胜在根基全面、防御气血略强。'},
{id:'siling',n:'四灵根',w:18,elems:['金','木','水','火','土'],grade:'黄',rate:.95,atk:0,def:.02,hp:.02,d:'四系杂灵根，中规中矩。'},
{id:'sanling',n:'三灵根',w:16,elems:['金','木','水','火','土'],grade:'黄',rate:1.06,atk:.02,def:.02,hp:.02,d:'三系灵根，资质已算不错。'},
{id:'shuangling',n:'双灵根',w:12,elems:['金','木','水','火','土'],grade:'玄',rate:1.20,atk:.05,def:.05,hp:.05,d:'双系相生，宗门争抢的好苗子。'},
{id:'jinling',n:'金灵根',w:4,elems:['金'],grade:'玄',rate:1.28,atk:.15,def:0,hp:0,d:'锐金之气入体，攻势凌厉，攻击 +15%。'},
{id:'muling',n:'木灵根',w:4,elems:['木'],grade:'玄',rate:1.28,atk:0,def:0,hp:.25,d:'生生不息，气血上限 +25%。'},
{id:'shuiling',n:'水灵根',w:4,elems:['水'],grade:'玄',rate:1.28,atk:0,def:.12,hp:.08,d:'上善若水，防御 +12%、气血 +8%。'},
{id:'huoling',n:'火灵根',w:4,elems:['火'],grade:'玄',rate:1.28,atk:.12,def:0,hp:0,d:'烈火燎原，攻击 +12%。'},
{id:'tuling',n:'土灵根',w:4,elems:['土'],grade:'玄',rate:1.28,atk:0,def:.18,hp:.10,d:'厚德载物，防御 +18%、气血 +10%。'},
{id:'leiling',n:'雷灵根（变异）',w:2.5,elems:['雷'],grade:'地',rate:1.38,atk:.20,def:0,hp:0,d:'变异雷根，天威随身，攻击 +20%。'},
{id:'bingling',n:'冰灵根（变异）',w:2.5,elems:['冰'],grade:'地',rate:1.38,atk:0,def:.20,hp:.05,d:'变异冰根，寒霜护体，防御 +20%。'},
{id:'fengling',n:'风灵根（变异）',w:2,elems:['风'],grade:'地',rate:1.40,atk:.08,def:.08,hp:0,flee:.15,d:'变异风根，来去如风，逃跑成功率 +15%。'},
{id:'tianling',n:'天灵根',w:2,elems:['金','木','水','火','土'],grade:'天',rate:1.62,atk:.08,def:.08,hp:.08,d:'万中无一的天灵根，修炼如飞，全属性 +8%。'},
{id:'jianling',n:'剑灵根',w:1.2,elems:['金'],grade:'地',rate:1.35,atk:.30,def:0,hp:0,d:'为剑而生，攻击 +30%，剑修圣体。'},
{id:'xueling',n:'血灵根',w:1,elems:['火','血'],grade:'地',rate:1.30,atk:.22,def:0,hp:-.05,d:'以血养气，攻击 +22%，气血略弱。'},
{id:'wuxingling',n:'五行灵根',w:.5,elems:['金','木','水','火','土'],grade:'天',rate:1.55,atk:.12,def:.12,hp:.12,d:'五行圆满，全属性 +12%，攻守兼备。'},
{id:'yinyangling',n:'阴阳灵根',w:.3,elems:['金','木','水','火','土','雷','冰','风'],grade:'天',rate:1.70,atk:.15,def:.15,hp:.15,d:'阴阳交泰，全属性 +15%，亲和万法。'},
{id:'hundunling',n:'混沌灵根',w:.2,elems:['金','木','水','火','土','雷','冰','风'],grade:'天',rate:2.0,atk:.25,def:.25,hp:.25,d:'传说中的混沌灵根，全属性 +25%，修炼速度翻倍。'}
];
function rollRoot(){
 var tot=0;ROOTS.forEach(function(r){tot+=r.w});
 var x=Math.random()*tot;
 for(var i=0;i<ROOTS.length;i++){x-=ROOTS[i].w;if(x<=0)return ROOTS[i]}
 return ROOTS[0];
}
function setRoot(g,d){g.rootId=d.id;g.root=d.grade;g.elem=d.elems[Math.floor(Math.random()*d.elems.length)]}
function rootDef(){
 if(G&&G.rootId){for(var i=0;i<ROOTS.length;i++)if(ROOTS[i].id===G.rootId)return ROOTS[i]}
 return{n:(G?G.root:'黄')+'品灵根',grade:(G?G.root:'黄'),rate:(G&&RM[G.root])||1,atk:0,def:0,hp:0,d:'旧时灵根，修炼与战斗无额外加成。',elems:[G?G.elem:'金']};
}
function rootBonusTxt(d){
 var s=[];
 if(d.atk)s.push('攻 '+(d.atk>0?'+':'')+Math.round(d.atk*100)+'%');
 if(d.def)s.push('防 '+(d.def>0?'+':'')+Math.round(d.def*100)+'%');
 if(d.hp)s.push('血 '+(d.hp>0?'+':'')+Math.round(d.hp*100)+'%');
 if(d.flee)s.push('逃跑 +'+Math.round(d.flee*100)+'%');
 return s.length?s.join(' · '):'无额外加成';
}
function showRootStart(){
 var d=rootDef();
 ov.innerHTML='<h5>测灵台 · 开局灵根</h5><div class="tx">灵根由天定，共 '+ROOTS.length+' 种。这一世你抽到的是：</div>'+
 '<div class="tx"><b style="color:#f2d79b;font-size:15px">'+d.n+'</b>（'+d.grade+'品 · '+G.elem+'系）<br>修炼速度 ×'+d.rate.toFixed(2)+' · '+rootBonusTxt(d)+'<br>'+d.d+'</div>'+
 '<button class="op" data-a="rootOk">就它了，开始修行</button>'+
 '<button class="op '+((G.reroll>0)?'':'x')+'" data-a="rootRe">再测一次（剩余 '+G.reroll+' 次，免费）</button>'+
 '<div class="cg">开局可免费重测 5 次。灵根由天定，入世之后不可再测。</div>';
 ov.className='ov on';
}
function showRootCand(){
 if(!PR)return;
 var o=rootDef();
 ov.innerHTML='<h5>重测灵根</h5><div class="tx">旧灵根：<b style="color:#f2d79b">'+o.n+'</b>（'+o.grade+'品 · '+G.elem+'系）<br>修炼 ×'+o.rate.toFixed(2)+' · '+rootBonusTxt(o)+'</div>'+
 '<div class="tx">新灵根：<b style="color:#f2d79b">'+PR.n+'</b>（'+PR.grade+'品 · '+PR.elems.join('/')+'系随机）<br>修炼 ×'+PR.rate.toFixed(2)+' · '+rootBonusTxt(PR)+'<br>'+PR.d+'</div>'+
 '<button class="op" data-a="rootAccept">换成新灵根</button><button class="op" data-a="rootKeep">留着旧灵根</button>'+
 '<div class="cg">测灵的消耗已扣除，留旧根也不会退还</div>';
 ov.className='ov on';
}

  var F={tap:[620,.045,'sine',.028],hit:[170,.07,'square',.05],crit:[860,.11,'sawtooth',.06],hurt:[130,.09,'square',.045],win:[660,.12,'sine',.055],lose:[210,.16,'sine',.05],up:[790,.12,'sine',.055],coin:[990,.06,'sine',.04]}[k]||[440,.05,'sine',.03];

function eff(s){
 if(!s||s=='*')return;
 var _eg=[];
 (''+s).split(',').forEach(function(t){
  t=t.trim();if(!t)return;
  if(t.indexOf('flag_')==0){G.flags[t.slice(5)]=1;return}

  if(t=='health'){G.hp=hmax();return}
  var m=t.match(/^([a-z]+)([+-])(\d+)$/);if(!m)return;

  else if(k=='demon')G.demon=Math.max(0,G.demon+v);
  else if(k=='ins')G.ins=Math.max(1,G.ins+v);
  else if(k=='bone')G.bone=Math.max(1,G.bone+v);
  else if(k=='age')G.age+=v;
  else if(k=='life')G.life+=v;
  else if(k=='enh')G.enh=(G.enh||0)+v;
  else if(k=='ref')G.ref=(G.ref||0)+v;
  else if(k=='star')G.star=(G.star||0)+v;
  else if(k=='herb'){G.herb=Math.max(0,G.herb+v);if(v>0)_eg.push('灵草 +'+v)}
  else if(k=='ore'){G.ore=Math.max(0,G.ore+v);if(v>0)_eg.push('玄铁 +'+v)}
  else if(k=='fame')G.fame+=v;
 });
 if(_eg.length)gainPop(_eg);
}
function cond(c){

  if(t.indexOf('r>=')==0){if(G.realm<+t.slice(3))ok=0}
  else if(t.indexOf('dao>=')==0){if(G.dao<+t.slice(5))ok=0}
  else if(t.indexOf('demon>=')==0){if(G.demon<+t.slice(7))ok=0}
  else if(t.indexOf('karma<=')==0){if(G.karma>+t.slice(7))ok=0}
  else if(t.indexOf('karma>=')==0){if(G.karma<+t.slice(7))ok=0}
  else if(t.indexOf('fame>=')==0){if(G.fame<+t.slice(6))ok=0}
  else if(t.indexOf('noflag_')==0){if(G.flags[t.slice(7)])ok=0}
  else if(t.indexOf('flag_')==0){if(!G.flags[t.slice(5)])ok=0}
 });
 return ok;
}

function eqDeltaHtml(it){
